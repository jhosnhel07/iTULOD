<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — iTULOD | Ilocos Transport, Delivery &amp; Logistics</title>
    <meta
      name="description"
      content="Set a new password for your iTULOD account."
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2196F3" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <!-- Same auth-page / login-card layout as login.html — kept visually identical. -->
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="auth-page">
      <!-- ═══════════════ LEFT BRANDING PANEL ═══════════════ -->
      <aside class="brand-panel">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <a href="index.html" class="bp-logo">
          <img
            src="assets/logo.png"
            alt="iTULOD logo"
            onerror="this.style.display = 'none'"
          />
          <span class="bp-logo-text">iTULOD<span>.</span></span>
        </a>

        <div class="bp-body">
          <div class="bp-tagline">
            <i class="fa-solid fa-lock"></i>
            Account Security
          </div>

          <h1 class="bp-headline">Choose a new password</h1>

          <p class="bp-subtitle">
            Pick something you haven't used before. You'll be signed out
            everywhere else once it's changed.
          </p>
        </div>

        <a href="login.html" class="back-link" style="margin-top: 32px">
          <i class="fa-solid fa-arrow-left"></i> Back to log in
        </a>
      </aside>

      <!-- ═══════════════ RIGHT FORM PANEL ═══════════════ -->
      <main class="form-panel">
        <div class="login-card">
          <a href="index.html" class="card-logo-row">
            <img
              src="assets/logo.png"
              alt="iTULOD"
              onerror="this.style.display = 'none'"
            />
            <span>iTULOD<em>.</em></span>
          </a>

          <h1 class="card-title">Reset your password</h1>
          <p class="card-sub" id="reset-sub">
            Enter a new password for your account below.
          </p>

          <form id="reset-form" novalidate>
            <div class="input-group">
              <label for="new-password">New password</label>
              <div class="input-wrap">
                <i class="fa-solid fa-lock input-icon"></i>
                <input
                  type="password"
                  id="new-password"
                  required
                  minlength="8"
                  placeholder="At least 8 characters"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="pw-toggle-btn"
                  id="pw-toggle-1"
                  aria-label="Toggle password visibility"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="input-group">
              <label for="confirm-password">Confirm new password</label>
              <div class="input-wrap">
                <i class="fa-solid fa-lock input-icon"></i>
                <input
                  type="password"
                  id="confirm-password"
                  required
                  minlength="8"
                  placeholder="Re-enter the password above"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="pw-toggle-btn"
                  id="pw-toggle-2"
                  aria-label="Toggle password visibility"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="login-btn" id="reset-btn">
              <i class="fa-solid fa-key"></i>
              Set new password
            </button>
          </form>

          <p class="register-link">
            Link expired or already used?
            <a href="login.html">Request a new one from log in</a>
          </p>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="js/pwa.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
