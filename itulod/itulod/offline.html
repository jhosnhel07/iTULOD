<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — iTULOD</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2196F3" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FFF5F5; color: #4A4A4A;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    .card { max-width: 360px; }
    img { width: 72px; height: 72px; }
    h1 { color: #0D47A1; font-size: 1.4rem; margin: 16px 0 8px; }
    p { margin: 0 0 20px; }
    button {
      background: #2196F3; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0D47A1; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/icon-192.png" alt="iTULOD" />
    <h1>You're offline</h1>
    <p>iTULOD needs a connection to load bookings and maps. Check your signal and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
